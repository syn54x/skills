# Run with prek: `prek install` once, then hooks run on commit. `prek run --all-files` on demand.
repos:
  - repo: local
    hooks:
      - id: check-plugin-skills
        name: plugin.json lists every skill
        entry: scripts/check-plugin-skills.sh
        language: script
        pass_filenames: false
        files: ^(skills/[^/]+/SKILL\.md|\.claude-plugin/plugin\.json)$
